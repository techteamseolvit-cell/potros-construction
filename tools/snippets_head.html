<script>
(function () {
  const KEYS = [
    "utm_source","utm_medium","utm_campaign","utm_term","utm_content",
    "utm_id","gclid","gbraid","wbraid","fbclid","ref","msclkid"
  ];
  const STORAGE_KEY = "persisted_utm_params_v1";

  function collectFromLocation() {
    const src = new URLSearchParams(window.location.search);
    const kept = {};
    let found = false;
    KEYS.forEach(k => {
      if (src.has(k)) { kept[k] = src.get(k); found = true; }
    });
    if (found) {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(kept));
      return kept;
    }
    const saved = sessionStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : {};
  }

  function decorateUrl(href, params) {
    if (!href) return href;
    if (href.startsWith("#") || href.startsWith("mailto:") || href.startsWith("tel:") || href.startsWith("javascript:")) return href;

    let url;
    try { url = new URL(href, window.location.origin); } catch(e){ return href; }

    // Only decorate same-origin links
    if (url.origin !== window.location.origin) return href;

    Object.keys(params).forEach(k => {
      if (!url.searchParams.has(k)) {
        url.searchParams.set(k, params[k]);
      }
    });
    return url.toString();
  }

  function decorateAll(params, root=document) {
    if (!params || Object.keys(params).length === 0) return;

    root.querySelectorAll("a[href]").forEach(a => {
      const newHref = decorateUrl(a.getAttribute("href"), params);
      if (newHref) a.setAttribute("href", newHref);
    });

    root.querySelectorAll("form[method='get' i]").forEach(form => {
      Object.entries(params).forEach(([k,v]) => {
        if (!form.querySelector(`input[name="${k}"]`)) {
          const hidden = document.createElement("input");
          hidden.type = "hidden";
          hidden.name = k;
          hidden.value = v;
          form.appendChild(hidden);
        }
      });
    });
  }

  function run() {
    const params = collectFromLocation();
    decorateAll(params);

    const mo = new MutationObserver(muts => {
      const p = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "{}");
      muts.forEach(m => m.addedNodes.forEach(n => {
        if (n.nodeType === 1) decorateAll(p, n);
      }));
    });
    mo.observe(document.documentElement, { childList: true, subtree: true });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }
})();
</script>
